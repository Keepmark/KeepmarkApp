<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Keepmark</title>
  <link rel="stylesheet" href="./popup/popup.css" />
</head>
<body>
  <header>
    <h1><img src="./assets/icon32.png" alt="" width="20" height="20" /> Keepmark</h1>
    <div id="sync-state" class="state">…</div>
  </header>

  <section id="view-connect">
    <h2>Connect</h2>
    <label>Service URL
      <input id="service-url" type="url" placeholder="https://api.xbrowsersync.org" />
    </label>
    <label>Sync ID <span class="hint">(existing sync only)</span>
      <input id="sync-id" type="text" placeholder="optional for a new sync" />
    </label>
    <label>Password
      <input id="password" type="password" autocomplete="current-password" />
    </label>
    <div id="connect-error" class="error" hidden></div>
    <div class="row">
      <button id="btn-new-sync">New sync</button>
      <button id="btn-existing-sync">Use existing</button>
      <button id="btn-open-tab" title="Open in a full tab (stays open while you copy from your vault)">⧉ Tab</button>
    </div>
  </section>

  <section id="view-main" hidden>
    <div class="card">
      <div class="status-row">
        <span id="p-pill" class="pill">…</span>
        <span id="p-service-badge" class="badge"></span>
      </div>
      <dl class="status-grid">
        <dt>Server</dt>
        <dd id="p-server">…</dd>
        <dt>Sync ID</dt>
        <dd><code id="p-syncid">…</code> <button id="btn-copy-id" class="mini">Copy</button></dd>
        <dt>Last sync</dt>
        <dd id="p-last">…</dd>
        <dt>Space used</dt>
        <dd>
          <div class="meter"><div id="p-space-fill"></div></div>
          <span id="p-space">…</span>
        </dd>
      </dl>
    </div>
    <div id="main-error" class="error" hidden></div>
    <div class="row">
      <button id="btn-sync-now">⇅ Sync now</button>
      <button id="btn-manage">⚙ Manage</button>
    </div>
  </section>

  <script type="module" src="./popup/popup.ts"></script>
</body>
</html>
