<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Keepmark</title>
  <link rel="stylesheet" href="./popup/popup.css" />
</head>
<body>
  <header>
    <h1><span class="brand-chip"><img src="./assets/brand-mark.png" alt="" /></span> Keepmark</h1>
    <div id="sync-state" class="state">…</div>
  </header>

  <section id="view-connect">
    <h2>Connect</h2>
    <label class="check"><input type="radio" name="conn-mode" value="new" checked />
      <span><b>New sync</b> — create a sync on the service and upload this browser's bookmarks.</span></label>
    <label class="check"><input type="radio" name="conn-mode" value="existing" />
      <span><b>Use existing</b> — link this browser to a sync ID; remote bookmarks will replace the local ones.</span></label>
    <label>Service URL
      <input id="service-url" type="url" placeholder="https://api.xbrowsersync.org" />
    </label>
    <div id="conn-existing-only" hidden>
      <label>Sync ID
        <input id="sync-id" type="text" placeholder="sync id from your other device" />
      </label>
      <label class="check"><input type="radio" name="conn-direction" value="pull" checked />
        <span>⬇ <b>Download</b> — replace local bookmarks with the server copy (safe, recommended).</span></label>
      <label class="check"><input type="radio" name="conn-direction" value="push" />
        <span>⬆ <b>Upload</b> — overwrite the server copy with my local bookmarks (deletes server data!).</span></label>
      <div id="conn-push-warn" hidden>
        <p class="warning">This replaces the server copy. A backup of it is downloaded first, and you can undo afterwards — but be sure.</p>
        <label class="check"><input id="conn-push-confirm" type="checkbox" />
          <span>I understand the server copy will be replaced.</span></label>
      </div>
    </div>
    <label>Password
      <input id="password" type="password" autocomplete="current-password" />
    </label>
    <div id="conn-new-only">
      <label>Confirm password
        <input id="confirm-password" type="password" autocomplete="new-password" />
      </label>
    </div>
    <div id="connect-error" class="error" hidden></div>
    <div class="row">
      <button id="btn-connect">Connect</button>
      <button id="btn-open-tab" title="Open in a full tab (stays open while you copy from your vault)">⧉ Tab</button>
    </div>
  </section>

  <section id="view-main" hidden>
    <div class="card">
      <div class="status-row">
        <span id="p-pill" class="pill">…</span>
        <span id="p-service-badge" class="badge"></span>
      </div>
      <dl class="status-grid">
        <dt>Server</dt>
        <dd id="p-server">…</dd>
        <dt>Service version</dt>
        <dd id="p-swversion">…</dd>
        <dt>Sync ID</dt>
        <dd><code id="p-syncid">…</code> <button id="btn-copy-id" class="mini">Copy</button></dd>
        <dt>Last sync</dt>
        <dd id="p-last">…</dd>
        <dt>Space used</dt>
        <dd>
          <div class="meter"><div id="p-space-fill"></div></div>
          <span id="p-space">…</span>
        </dd>
      </dl>
    </div>
    <div id="main-error" class="error" hidden></div>
    <div id="p-undo" class="undo" hidden>
      <span id="p-undo-text"></span>
      <span class="row"><button id="btn-undo" class="mini">Undo</button>
      <button id="btn-undo-dismiss" class="mini">Dismiss</button></span>
    </div>
    <div class="row">
      <button id="btn-sync-now">⇅ Sync now</button>
      <button id="btn-manage">⚙ Manage</button>
    </div>
  </section>

  <script type="module" src="./popup/popup.ts"></script>
</body>
</html>
